# Managed by ansible rclone-sync role.
# One line per job in format job_key|rclone_cmd|rclone_arg1|...|rclone_argN
{% for key, config in rclone_sync_config.dirs.items() %}
{{ key }}{% for cmd in config.rclone_cmd %}|{{ cmd }}{% endfor %}{% for arg in rclone_sync_config.rclone_args|default([]) + rclone_sync_config.rclone_sync_args|default([]) + config.rclone_args|default([]) + config.rclone_sync_args|default([]) %}|{{ arg }}{% endfor %}{{ '\n' }}{% endfor %}
