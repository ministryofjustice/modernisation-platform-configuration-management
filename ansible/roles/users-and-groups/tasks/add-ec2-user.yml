---
# Explicitly disable ec2-user password to avoid account locked issue on some OS

- name: Check if ec2-user exists
  ansible.builtin.getent:
    database: passwd
    key: ec2-user
  ignore_errors: true
  failed_when: false

- name: Disable ec2-user password
  ansible.builtin.user:
    name: ec2-user
    password: "*"
    password_expire_max: -1
  when: getent_passwd["ec2-user"] is defined

- name: Update ec2-user authorized keys
  ansible.posix.authorized_key:
    user: ec2-user
    key: "{{ ec2_user_authorized_keys }}"
  when: ec2_user_authorized_keys is defined
