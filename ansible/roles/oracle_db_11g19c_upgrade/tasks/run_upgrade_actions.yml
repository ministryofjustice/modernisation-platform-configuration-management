# Get upgrade status from log file
- name: Get Upgrade Status from Log
  command: tail -40 /u01/app/oracle/admin/{{ db_name }}/upgrade/catupgrd0.log
  register: upgrade_status_log
  when: database_role == "PRIMARY"
  tags:
    - upgrade
    - validation

- name: Report Upgrade Status
  debug: var=upgrade_status_log.stdout_lines
  when: database_role == "PRIMARY"
  tags:
    - upgrade
    - validation
    - debug