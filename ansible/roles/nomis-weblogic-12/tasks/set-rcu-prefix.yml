- name: Ensure WebLogic software directory exists
  ansible.builtin.file:
    path: /u01/software/weblogic
    state: directory
    owner: oracle
    group: oinstall
    mode: "0755"

- name: Read existing local RCU prefix marker if present
  ansible.builtin.stat:
    path: /u01/software/weblogic/.rcu_prefix
  register: rcu_prefix_marker

- name: Load existing local RCU prefix marker
  ansible.builtin.slurp:
    src: /u01/software/weblogic/.rcu_prefix
  register: rcu_prefix_marker_contents
  when: rcu_prefix_marker.stat.exists

# display the contents of the marker file for debugging purposes
- name: Debug existing local RCU prefix marker contents
  ansible.builtin.debug:
    msg: "Existing local RCU prefix marker contents: {{ rcu_prefix_marker_contents.content | b64decode | trim }}"
  when: rcu_prefix_marker.stat.exists

- name: Reuse existing local RCU prefix if present
  ansible.builtin.set_fact:
    weblogic_db_repo_prefix: "{{ rcu_prefix_marker_contents.content | b64decode | trim }}"
  when: rcu_prefix_marker.stat.exists

- name: Derive base RCU prefix if not already set
  when: not rcu_prefix_marker.stat.exists
  block:
    - name: Determine RCU prefix in database
      become_user: oracle
      ansible.builtin.shell: |
        set -eo pipefail
        source ~oracle/.bash_profile

        sqlplus -s /nolog <<'SQL'
        connect sys/{{ weblogic_db_repo_password }}@{{ weblogic_db_repo_hostname }}:1521/{{ weblogic_db_repo_sid }} as sysdba
        set heading off feedback off verify off echo off pagesize 0 trimspool on serveroutput on size unlimited

        declare
          v_ec2_name              varchar2(255) := q'[{{ ec2.tags.Name }}]';
          v_first_part            varchar2(255);
          v_last_part             varchar2(255);
          v_first_alpha           varchar2(255);
          v_first_numeric         varchar2(255);
          v_last_numeric          varchar2(255);
          v_raw_base              varchar2(255);
          v_base_prefix           varchar2(12);
          v_candidate             varchar2(12);
          v_selected_prefix       varchar2(12);
          v_registry_exists       number := 0;
          v_registry_match_count  number := 0;
          v_stb_user_count        number := 0;
          v_total_matches         number := 0;

          procedure debug(p_message in varchar2) is
          begin
            dbms_output.put_line('DEBUG: ' || p_message);
          end;
        begin
          v_first_part := regexp_substr(lower(v_ec2_name), '[^-]+', 1, 1);
          v_last_part := regexp_substr(lower(v_ec2_name), '[^-]+', 1, regexp_count(v_ec2_name, '-') + 1);
          v_first_alpha := regexp_substr(v_first_part, '^[[:alpha:]]+');
          v_first_numeric := regexp_substr(v_first_part, '[[:digit:]]+');
          v_last_numeric := regexp_substr(v_last_part, '[[:digit:]]+');
          v_raw_base := regexp_replace(
            upper(
              nvl(v_first_alpha, '') ||
              nvl(v_first_numeric, '') ||
              'W' ||
              nvl(v_last_numeric, '')
            ),
            '[^A-Z0-9]',
            ''
          );
          v_base_prefix := substr(v_raw_base, 1, 8);

          debug('EC2 Name tag: ' || v_ec2_name);
          debug('Derived first part of EC2 Name tag: ' || v_first_part);
          debug('Derived last part of EC2 Name tag: ' || v_last_part);
          debug('Derived alphabetic portion of first part: ' || nvl(v_first_alpha, '<null>'));
          debug('Derived numeric portion of first part: ' || nvl(v_first_numeric, '<null>'));
          debug('Derived numeric portion of last part: ' || nvl(v_last_numeric, '<null>'));
          debug('Derived raw RCU prefix base: ' || v_raw_base);
          debug('Derived truncated RCU prefix base (8 chars max): ' || v_base_prefix);

          if not regexp_like(v_base_prefix, '^[A-Z][A-Z0-9]{0,7}$') then
            raise_application_error(
              -20001,
              'Derived RCU prefix base "' || v_base_prefix || '" is invalid. ' ||
              'It must start with a letter, contain only A-Z and 0-9, and be 1-8 characters long. ' ||
              'Expected EC2 Name tag format like qa11g-nomis-web12-a.'
            );
          end if;

          select count(*)
          into v_registry_exists
          from dba_views
          where owner = user
            and view_name = 'SCHEMA_VERSION_REGISTRY';

          debug('schema_version_registry exists in schema ' || user || ': ' ||
                case when v_registry_exists > 0 then 'yes' else 'no' end);

          for i in 0 .. 9999 loop
            if i = 0 then
              v_candidate := substr(v_base_prefix, 1, 12);
            else
              v_candidate := substr(v_base_prefix, 1, 8) || lpad(to_char(i), 4, '0');
            end if;

            v_registry_match_count := 0;
            v_stb_user_count := 0;

            if v_registry_exists > 0 then
              execute immediate
                'select count(*) from schema_version_registry where mrc_name = :candidate'
                into v_registry_match_count
                using upper(v_candidate);
            end if;

            select count(*)
            into v_stb_user_count
            from dba_users
            where username = upper(v_candidate || '_STB');

            v_total_matches := v_registry_match_count + v_stb_user_count;

            debug(
              'Candidate ' || v_candidate ||
              ' => schema_version_registry matches=' || v_registry_match_count ||
              ', dba_users matches=' || v_stb_user_count ||
              ', total=' || v_total_matches
            );

            if v_total_matches = 0 then
              v_selected_prefix := v_candidate;
              exit;
            end if;
          end loop;

          if v_selected_prefix is null then
            raise_application_error(
              -20002,
              'Could not find an unused RCU prefix from candidates derived from "' || v_base_prefix ||
              '". Tried ' || v_base_prefix || ', ' ||
              v_base_prefix || '0001 through ' || v_base_prefix || '9999. ' ||
              'All candidates are in use in schema_version_registry or dba_users.'
            );
          end if;

          debug('Selected RCU prefix: ' || v_selected_prefix);
          dbms_output.put_line(v_selected_prefix);
        end;
        /

        exit
        SQL
      args:
        executable: /bin/bash
      register: rcu_prefix_selection
      changed_when: false
      no_log: true

    - name: Debug RCU prefix selection output
      ansible.builtin.debug:
        var: rcu_prefix_selection.stdout_lines

    - name: Set selected RCU prefix
      ansible.builtin.set_fact:
        weblogic_db_repo_prefix: >-
          {{
            (
              rcu_prefix_selection.stdout_lines
              | reject('match', '^DEBUG:')
              | reject('match', '^\\s*$')
              | reject('equalto', '')
              | list
              | last
            )
            | trim
          }}

    - name: Debug selected RCU prefix from database
      ansible.builtin.debug:
        msg: "Selected RCU prefix from database: {{ weblogic_db_repo_prefix }}"

    - name: Final validation of selected RCU prefix
      ansible.builtin.assert:
        that:
          - weblogic_db_repo_prefix is match('^[A-Z][A-Z0-9]{0,11}$')
        fail_msg: "Selected RCU prefix '{{ weblogic_db_repo_prefix }}' is invalid."

    - name: Persist local RCU prefix marker
      ansible.builtin.copy:
        content: "{{ weblogic_db_repo_prefix }}\n"
        dest: /u01/software/weblogic/.rcu_prefix
        owner: oracle
        group: oinstall
        mode: "0600"
        force: false

# Display the final RCU prefix for debugging purposes
- name: Debug the final RCU prefix
  ansible.builtin.debug:
    msg: "Selected RCU prefix: {{ weblogic_db_repo_prefix }}"
