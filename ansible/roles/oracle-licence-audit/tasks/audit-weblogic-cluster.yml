- name: Audit weblogic clusters
  block:

    # ----------------------------------------------------------------
    # RESOLVE ACCOUNT ID AND ACCOUNT NAME
    # ----------------------------------------------------------------

    - name: Get AWS account ID
      amazon.aws.aws_caller_info:
      register: caller_info

    # ----------------------------------------------------------------
    # DISCOVER ALL ECS CLUSTERS IN THE ACCOUNT
    # ----------------------------------------------------------------

    - name: List all ECS clusters in the account
      delegate_to: localhost
      become: no
      shell: >
        aws ecs list-clusters --region {{ region }} | jq -r '.clusterArns[]' | awk -F'/' '{print $NF}'
      register: all_ecs_clusters
      changed_when: false

    - name: Initialise combined audit records
      set_fact:
        weblogic_audit_records: []

    - name: Audit each ECS cluster for weblogic services
      include_tasks: audit-weblogic-single-cluster.yml
      loop: "{{ all_ecs_clusters.stdout_lines }}"
      loop_control:
        loop_var: weblogic_cluster
      when: all_ecs_clusters.stdout_lines | length > 0

    # ----------------------------------------------------------------
    # OUTPUT — JSON FILE
    # ----------------------------------------------------------------

    - name: Write audit output
      when: weblogic_audit_records | length > 0
      block:

        - name: Create audit directory
          delegate_to: localhost
          become: no
          file:
            path: "{{ audit_dir }}"
            state: directory

        - name: Remove old weblogic results file
          delegate_to: localhost
          become: no
          file:
            path: "{{ weblogic_cluster_output }}"
            state: absent

        - name: Write audit records as JSON
          delegate_to: localhost
          become: no
          copy:
            content: "{{ weblogic_audit_records | to_nice_json }}"
            dest: "{{ weblogic_cluster_output }}"

        - name: Upload audit results
          when: upload_collection | default(true) | bool
          delegate_to: localhost
          become: no
          shell: >
            aws s3 cp {{ weblogic_cluster_output }} s3://{{ bucket_name }}/{{ audit_output }}/ --acl bucket-owner-full-control {{ general_kms_key_option }}