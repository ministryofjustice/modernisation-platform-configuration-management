- name: Check platform of instance from localhost
  delegate_to: localhost
  become: no
  shell: |
    PATH=$PATH:/usr/local/bin
    aws ec2 describe-instances \
      --filters "Name=tag:Name,Values={{ inventory_hostname }}" \
      --query "Reservations[].Instances[].PlatformDetails" \
      --region {{ region }} --output text
  register: ec2_platform_check
  changed_when: false
  ignore_errors: true

- name: CPU auditing (Linux only)
  when:
    - ec2_platform_check is succeeded
    - "'Linux' in ec2_platform_check.stdout"
  block:

    - name: Check if WebLogic is running
      shell: ps -ef | grep weblogic | grep -v grep | grep -v oem | wc -l
      register: weblogic_process
      changed_when: false

    - name: Get the current caller identity information
      amazon.aws.aws_caller_info:
      register: caller_info

    - name: Get instance ID from cloud-init data
      shell: cat /var/lib/cloud/data/instance-id
      register: ec2_instance_id
      changed_when: false

    - name: Set instance ID fact
      set_fact:
        instance_id: "{{ ec2_instance_id.stdout }}"

    - name: Get EC2 Name tag
      shell: |
        PATH=$PATH:/usr/local/bin
        aws ec2 describe-tags \
          --filters "Name=resource-id,Values={{ instance_id }}" "Name=key,Values=Name" \
          --query "Tags[0].Value" \
          --region {{ region }} --output text
      register: ec2_name_tag
      changed_when: false

    - name: Set instance name fact
      set_fact:
        instance_name: "{{ ec2_name_tag.stdout if ec2_name_tag.stdout != '' and ec2_name_tag.stdout != 'None' else inventory_hostname }}"

    # if weblogic is running then set the filename to include weblogic, otherwise set it to just account and hostname
    - name: Set audit filename based on WebLogic status
      set_fact:
        audit_filename: >-
          {{ caller_info.account }}_{{ instance_name }}{{ '_weblogic' if weblogic_process.stdout != '0' else '' }}

    - name: Create work directory on remote host
      file:
        path: "{{ audit_dir }}"
        state: directory
        owner: oracle
        mode: "777"

    - name: Download utility shell scripts to {{ audit_dir }}
      copy:
        src: "{{ item }}"
        dest: "{{ audit_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - cpuq.sh

    - name: Check if cpuq.sh script exists
      stat:
        path: "{{ audit_dir }}/cpuq.sh"
      register: cpuq_stat

    - name: Delete old cpu output files
      shell: |
        cd {{ audit_dir }}
        rm -f *cpu*.txt 2>/dev/null || true
      when: cpuq_stat.stat.exists

    - name: Execute cpu script
      shell: |
        cd {{ audit_dir }}
        echo 'y' | ./cpuq.sh {{ audit_dir }} > /dev/null 2>&1
      when: cpuq_stat.stat.exists
      register: cpuout

    # the output file may get named with an ip address as the machine name, so always rename it to ensure the name is the audit_filename
    - name: Rename cpu output file to standard name
      shell: |
        cd {{ audit_dir }}
        mv *ct_cpuq.txt {{ audit_filename | trim }}_ct_cpuq.txt
      when: cpuq_stat.stat.exists

    - name: Fetch cpu output files
      fetch:
        src: "{{ audit_dir }}/{{ audit_filename | trim }}_ct_cpuq.txt"
        dest: "{{ audit_dir }}/"
        flat: yes

    - name: Get CPU options and instance type from EC2
      shell: |
        PATH=$PATH:/usr/local/bin
        aws ec2 describe-instances \
          --instance-ids {{ instance_id }} \
          --query "Reservations[].Instances[].[CpuOptions,InstanceType]" \
          --region {{ region }} --output json
      register: ec2_cpu_options
      changed_when: false
      ignore_errors: true

    - name: Build EC2 instance audit record
      set_fact:
        ec2_audit_record: >-
          {%- set result = (ec2_cpu_options.stdout | from_json)[0] -%}
          {%- set cpu_opts = result[0] -%}
          {%- set instance_type = result[1] -%}
          {%- set cores = cpu_opts.CoreCount | int -%}
          {%- set threads = cpu_opts.ThreadsPerCore | int -%}
          {%- set vcpus = cores * threads -%}
          {{
            {
              'account_id': caller_info.account,
              'account_name': account_name | trim,
              'platform_manufacturer': 'Amazon',
              'virtualisation': 'EC2',
              'ecs_cluster_name': '',
              'instance_name': instance_name,
              'server_model': instance_type,
              'os': 'Linux',
              'processor_model': '',
              'vcpus': vcpus,
              'sockets': '',
              'cores_per_socket': '',
              'threads_per_core': threads
            }
          }}
      when: ec2_cpu_options is succeeded

    - name: Write audit record as JSON
      copy:
        content: "{{ [ec2_audit_record] | to_nice_json }}"
        dest: "{{ audit_dir }}/{{ audit_filename | trim }}_vcpus.json"
      when: ec2_audit_record is defined

    - name: Fetch vcpu output files
      fetch:
        src: "{{ audit_dir }}/{{ audit_filename | trim }}_vcpus.json"
        dest: "{{ audit_dir }}/"
        flat: yes
      ignore_errors: true
      changed_when: false
      when: ec2_audit_record is defined
