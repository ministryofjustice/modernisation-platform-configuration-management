{% for name, config in rclone_sharepoint_config.items() %}
[{{ name }}]
[sharepoint]
type = onedrive
client_credentials = true
client_id = {{ secretsmanager_passwords_dict[config.app_registrations_secret_key].passwords['client_id'] }}
client_secret = {{ secretsmanager_passwords_dict[config.app_registrations_secret_key].passwords['client_secret'] }}
tenant = {{ secretsmanager_passwords_dict[config.app_registrations_secret_key].passwords['tenant_id'] }}
drive_id = {{ secretsmanager_passwords_dict[config.drive_ids_secret_key].passwords[name] }}
drive_type = documentLibrary
{% endfor %}
