{% for name, config in rclone_sharepoint_config.items() %}
[{{ name }}]
type = onedrive
drive_type = business
client_id = {{ secretsmanager_passwords_dict[name].passwords['client_id'] }}
client_secret = {{ secretsmanager_passwords_dict[name].passwords['client_secret'] }}
tenant = {{ secretsmanager_passwords_dict[name].passwords['tenant_id'] }}
region = global
client_credentials = true
disable_site_permission = true
{% endfor %}
