- name: Resolve target database name
  set_fact:
     target_db_name: "{{ database_primary_sid | default(database_standby_sid) if (database_primary_sid is defined or database_standby_sid is defined) else ( target_db_names | from_json | combine )[inventory_hostname] }}"

- name: Get RAT playback password from Secrets Manager
  import_role:
    name: secretsmanager-passwords
  vars:
    secretsmanager_passwords: "{{ rat_playback_secretsmanager_passwords }}"
  no_log: true

- name: Set RAT playback account password
  set_fact:
    rat_playback_user_password: "{{ secretsmanager_passwords_dict['db'].passwords['rat_user'] }}"
  no_log: true

- name: Validate RAT playback inputs
  assert:
    that:
      - rat_playback_s3_location | length > 0
      - rat_playback_s3_location is match('^s3://')
      - rat_playback_synchronization in ['SCN', 'OBJECT_ID']
      - rat_playback_wrc_connection | length > 0
      - rat_playback_wrc_client_count | int > 0
      - rat_playback_wrc_client_startup_delay | int >= 0
    fail_msg: "Define rat_playback_s3_location as an S3 URI, rat_playback_wrc_connection, a positive rat_playback_wrc_client_count, and set rat_playback_synchronization to SCN or OBJECT_ID"

- name: Build RAT playback names
  set_fact:
     rat_playback_name: "{{ target_db_name | lower }}_{{ now(fmt='%Y%m%d%H%M%S') }}"
     rat_playback_directory_name: "RAT_PLAYBACK_{{ target_db_name | upper }}_{{ now(fmt='%y%m%d%H%M%S') }}"
     rat_playback_directory_path: "{{ rat_playback_base_dir }}/{{ target_db_name | lower }}/{{ now(fmt='%Y%m%d%H%M%S') }}"

- name: Create RAT playback directory on the database host
  file:
     path: "{{ rat_playback_directory_path }}"
     state: directory
     owner: oracle
     group: oinstall
     mode: '0750'
  become: true

- name: Download RAT capture files from S3
  command:
     argv:
        - aws
        - s3
        - sync
        - --no-progress
        - "{{ rat_playback_s3_location }}"
        - "{{ rat_playback_directory_path }}"
  become: true
  become_user: oracle

- name: Report downloaded RAT capture location
  debug:
     msg: "RAT capture files downloaded from {{ rat_playback_s3_location }} to {{ rat_playback_directory_path }}"

- name: Initialize RAT playback
  script: initialize_rat_playback.sh "{{ rat_playback_directory_name }}" "{{ rat_playback_directory_path }}" "{{ rat_playback_name }}"
  become: true
  become_user: oracle
  no_log: true
  environment:
     TARGET_DB_NAME: "{{ target_db_name }}"
     RAT_USER_PASSWORD: "{{ rat_playback_user_password }}"

- name: Calibrate RAT playback clients
  script: calibrate_rat_playback.sh "{{ rat_playback_directory_path }}" "{{ rat_playback_wrc_client_count }}" "{{ rat_playback_wrc_client_startup_delay }}"
  become: true
  become_user: oracle
  environment:
      TARGET_DB_NAME: "{{ target_db_name }}"
      RAT_PLAYBACK_WRC_CONNECTION: "RAT_USER/{{ rat_playback_user_password }}{{ '' if rat_playback_wrc_connection == '/' else '@' ~ rat_playback_wrc_connection }}"
    no_log: true

- name: Prepare and start RAT playback
  script: start_rat_playback.sh "{{ rat_playback_synchronization }}"
  become: true
  become_user: oracle
  environment:
      TARGET_DB_NAME: "{{ target_db_name }}"