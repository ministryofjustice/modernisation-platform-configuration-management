---
# Create missing AUDITDATA tables based on source schema objects

- name: Create missing AUDITDATA tables if local database is the audit database
  when: run_auditdata
  ansible.builtin.shell: |
    . ~/.bash_profile
    # connect to auditdata database as sysdba to generate DDL for source tables that do not yet exist in auditdata target schema
    export ORACLE_SID={{ oracle_goldengate_group.auditdata.tns_alias }}
    export ORACLE_HOME={{ oracle_goldengate_group.auditdata.oracle_home }}
    export PATH=${ORACLE_HOME}/bin:$PATH

    # Retrieve SYS password from AWS Secrets Manager
    SYS_PASSWORD=$(aws secretsmanager get-secret-value \
      --secret-id "/oracle/database/${ORACLE_SID}/passwords" \
      --query 'SecretString' \
      --output text 2>/dev/null | jq -r '.sys' 2>/dev/null)

    if [ -z "$SYS_PASSWORD" ]; then
      echo "ERROR: Cannot retrieve existing passwords secret for ${ORACLE_SID}"
      exit 1
    fi

    sqlplus -s sys/"${SYS_PASSWORD}"@${ORACLE_SID} as sysdba <<EOF
    column c1 format a4000
    set wrap on
    SET LONG 2000000
    SET PAGESIZE 0
    SET LINESIZE 9999
    SET FEEDBACK OFF
    SET HEADING OFF
    SET ECHO OFF
    SET TRIMSPOOL ON
    SET TERMOUT OFF
    SET SERVEROUTPUT ON

    BEGIN
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'SQLTERMINATOR', true);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'PRETTY', true);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'SIZE_BYTE_KEYWORD', false);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'SEGMENT_ATTRIBUTES', false);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'STORAGE', false);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'REF_CONSTRAINTS', false);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'TABLESPACE', false);
      DBMS_METADATA.set_transform_param(DBMS_METADATA.session_transform, 'PARTITIONING', false);
    END;
    /
    
    SELECT replace(auditdata_dml_pkg.get_metadata_over_dblink(o.object_type, o.owner, o.object_name),'{{ oracle_goldengate_group.source.schema_owner }}','{{ oracle_goldengate_group.auditdata.dummy_target_schema }}') c1
    FROM   dba_objects@{{ oracle_goldengate_group.source.tns_alias }} o
    WHERE  o.owner      = '{{ oracle_goldengate_group.source.schema_owner }}'
    AND    o.object_type in ('TABLE','CLUSTER')
    AND    EXISTS
      (SELECT 1 FROM dual d
        WHERE o.object_type = 'CLUSTER'
      UNION
      SELECT 1 FROM dba_tables@{{ oracle_goldengate_group.source.tns_alias }} t
        WHERE o.object_type = 'TABLE'
        AND t.owner = o.owner
        AND t.table_name = o.object_name
        AND (t.TABLESPACE_NAME IS NOT null or (t.TABLESPACE_NAME IS null and t.partitioned = 'YES'))
        ) -- exclude external tables but not partitioned tables without a tablespace assigned
    AND NOT EXISTS
      (SELECT 1
         FROM dba_objects m
        WHERE m.owner = '{{ oracle_goldengate_group.auditdata.dummy_target_schema }}'
          AND m.object_name = o.object_name
          AND m.object_type = o.object_type)
    order by decode(o.object_type, 'CLUSTER', 1, 'TABLE', 2), o.object_name

    spool /tmp/table_ddl.sql
    /

    spool off
    EXIT;
    EOF

    export ORACLE_SID={{ oracle_goldengate_group.auditdata.tns_alias }}
    export ORAENV_ASK=NO
    . oraenv > /dev/null 2>&1

    # run the generated SQL script in the target database to create missing tables and then run the apply_dml_conf script to create the DML handlers for the new tables
    sqlplus -s / as sysdba <<EOF
    SET ECHO ON
    SET FEEDBACK ON
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    spool /tmp/create_missing_auditdata_tables.log
    @/tmp/table_ddl.sql
    exec auditdata_dml_pkg.apply_dml_conf;
    spool off
    EXIT;
    EOF
  register: create_tables_output
  become: yes
  become_user: "{{ oracle_goldengate_owner }}"
  args:
    executable: /bin/bash
  changed_when: "'TABLE' in create_tables_output.stdout"
  failed_when: create_tables_output.rc != 0
