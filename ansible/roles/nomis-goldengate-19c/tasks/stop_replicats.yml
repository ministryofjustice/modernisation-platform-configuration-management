    chdir: "{{ oracle_goldengate_home }}"
  environment: "{{ gg_env | combine({'ORACLE_SID': oracle_goldengate_group.auditref.tns_alias}) }}"
  become: yes
  become_user: "{{ oracle_goldengate_owner }}"
  register: stop_auditref_replicat
  changed_when: "'stopped successfully' in stop_auditref_replicat.stdout.lower() or 'ABENDED' in stop_auditref_replicat.stdout"
