---
- name: Resolve ODBC driver paths for current EL major version
  ansible.builtin.set_fact:
    onr_arns_odbc_driver_path_pg: >-
      {{ onr_arns_odbc_driver_paths[ansible_distribution_major_version].pg }}
    onr_arns_odbc_driver_path_default: >-
      {{ onr_arns_odbc_driver_paths[ansible_distribution_major_version].default }}

- name: Configure ARNS PostgreSQL ODBC DSN
  ansible.builtin.template:
    src: odbc.ini.j2
    dest: "{{ onr_arns_odbc_ini }}"
    owner: root
    group: root
    mode: "0644"

- name: Test that PostgreSQL ODBC shared libraries resolve
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      rpm -ql postgresql12-odbc 2>/dev/null \
        | grep '\.so$' \
        | head -1 \
        | xargs -r ldd
    executable: /bin/bash
  register: onr_arns_odbc_ldd
  changed_when: false
  failed_when: false
  when: ansible_distribution_major_version == "7"