---
ansible_python_interpreter: /usr/bin/python3.9

server_type_roles_list:
  - autoscale-group-hooks
  - get-ec2-facts
  - selinux-config
  - ansible-requirements
  - ssh-host-keys
  - packages
  - time
  - users-and-groups
  - sudoers
  - disable-firewall
  - disable-ipv6
  - message-of-the-day
  - amazon-ssm-agent
  - amazon-cli
  - tcp-keepalive
  - disks
  - swap
  - set-ec2-hostname
  - domain-search
  - ansible-script
  - epel
  - sshd-config
  - nomis-weblogic-12
  - xsiam-agent
#  - collectd
  - amazon-cloudwatch-agent
#  - amazon-cloudwatch-agent-collectd
#  - collectd-service-metrics
#  - autoscale-group-hooks-state

roles_list: "{{ (ami_roles_list | default([]) | difference(server_type_roles_list | default([]))) + (server_type_roles_list | default([])) }}"

xsiam_agent_state: "{{ xsiam_agent_web12_state }}" # set in environment group_vars

# collectd_monitored_services_servertype:
#  - metric_name: service_status_os
#    metric_dimension: chronyd
#    shell_cmd: "service chronyd status"

packages_yum_update: []
packages_yum_install:
  - binutils
  - libstdc++-devel
  - libstdc++
  - sysstat
  - gcc
  - gcc-c++
  - ksh
  - make
  - glibc
  - libaio
  - libaio-devel
  - motif
  - motif-devel
  - libXtst-devel
  - redhat-lsb-4.1
  - redhat-lsb-core
  - libnsl
  - xterm # just for testing X
  - policycoreutils-python-utils

disks_mount:
  - ebs_device_name: /dev/sdb
    dir: /u01
    fstype: xfs

users_and_groups_system:
  - name: oracle
    create_xauthority: true
    group: oinstall
    groups:
      - dba
      - wheel

users_and_groups_create_xauthority: true
sshd_config_mode: allow_x11

nomis_environment: "{{ ec2.tags['nomis-environment'] }}"
oracle_db_name: "{{ ec2.tags['oracle-db-name'] }}"
weblogic_config_target: "{{ ec2.tags['weblogic-config-target'] }}"

oracle_setup_config:
  dev:
    - directory_path: /home/oracle/sysconsoftware/12c_setup_config
      extract_path: /home/oracle/sysconsoftware/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: 12c_setup_config.zip
    - directory_path: /u01/tag
      extract_path: /u01/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: u01_tag_config.zip

  qa:
    - directory_path: /home/oracle/sysconsoftware/12c_setup_config
      extract_path: /home/oracle/sysconsoftware/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: 12c_setup_config.zip
    - directory_path: /u01/tag
      extract_path: /u01/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: u01_tag_config_qa.zip

  rel:
    - directory_path: /home/oracle/sysconsoftware/12c_setup_config
      extract_path: /home/oracle/sysconsoftware/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: 12c_setup_config.zip
    - directory_path: /u01/tag
      extract_path: /u01/
      group: oinstall
      owner: oracle
      s3_bucket_path: nomis-weblogic-12
      zip_file_name: u01_tag_config_rel.zip

oracle_config: "{{ oracle_setup_config[nomis_environment] }}"

weblogic_configs:
  qa11g:
    weblogic_db_repo_hostname: "dev-nomis-db19c-1-b"
    weblogic_db_repo_sid: "qa11g"
    weblogic_db_repo_username: "sys"

  qa11g2:
    weblogic_db_repo_hostname: "dev-nomis-db19c-1-b"
    weblogic_db_repo_sid: "qa11g2"
    weblogic_db_repo_username: "sys"

  qa19c:
    weblogic_db_repo_hostname: "dev-nomis-db19c-1-b"
    weblogic_db_repo_sid: "qa19c"
    weblogic_db_repo_username: "sys"

  qa:
    weblogic_db_repo_hostname: "nomis-db19c-1-a"
    weblogic_db_repo_sid: "qa19c"
    weblogic_db_repo_username: "sys"

  rel:
    weblogic_db_repo_hostname: "nomis-db19c-1-a"
    weblogic_db_repo_sid: "rel19c"
    weblogic_db_repo_username: "sys"

weblogic_config: "{{ weblogic_configs[weblogic_config_target] }}"

weblogic_db_repo_hostname: "{{ weblogic_config.weblogic_db_repo_hostname }}"
weblogic_db_repo_sid: "{{ weblogic_config.weblogic_db_repo_sid }}"
weblogic_db_repo_username: "{{ weblogic_config.weblogic_db_repo_username }}"
