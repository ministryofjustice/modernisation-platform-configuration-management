---
# ansible_host is set in compose. Setting it here breaks delegation
ansible_connection: 'community.aws.aws_ssm'
ansible_aws_ssm_region: eu-west-2

# set timeout long enough for operations that don't support async, e.g. unarchive
ansible_aws_ssm_timeout: 300

# disable retrying as this doesn't work well with shell command that timeout, better to fail immediately
ansible_aws_ssm_retries: 0
ansible_aws_ssm_reconnection_retries: 0
